[project]
name = "constitucion-ai"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "markdown-it-py==4.0.0",
]

[project.scripts]
constitution-linter = "constitution_linter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/constitution_linter"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "bandit>=1.8.0",
    "codespell>=2.4.0",
    "pytest>=8.0.0",
    "types-PyYAML>=6.0.0",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
