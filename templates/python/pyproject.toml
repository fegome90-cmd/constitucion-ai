[project]
name = "python-config-kit-project"
version = "0.1.0"
description = "Proyecto mínimo generado desde el config kit Python"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "uv==0.13.9",
  "ruff==0.17.5",
  "mypy==2.4.1",
  "pytest==9.2.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
