name: Constitution CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-and-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          version: "0.13.9"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Install locked project dependencies
        run: uv sync --frozen --python 3.13
      - name: Lint Python
        run: uv run --frozen ruff check scripts/ tests/ tooling/
      - name: Format Python
        run: uv run --frozen ruff format --check scripts/ tests/ tooling/
      - name: Check Python types
        run: uv run --frozen mypy scripts/
      - name: Test deterministic linter behavior and manifest integrity
        run: >-
          uv run --frozen pytest tests/test_constitution_linter.py
          tests/test_pr12_regressions.py
          tests/test_config_kits.py::test_current_manifest_matches_files -q
      - name: Audit catalog structure (no starter dependency execution)
        run: uv run --frozen python tooling/audit.py --output /tmp/constitution-structure.json

  starter-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          version: "0.13.9"
          enable-cache: true
      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python
        run: uv python install 3.13
      - name: Install locked project dependencies
        run: uv sync --frozen --python 3.13
      - name: Verify provisioned Python and Java runtimes
        run: |
          command -v uv
          command -v java
          command -v javac
          command -v mvn
          java -version
          javac -version
      - name: Test exported Python and Java starters (registry dependent)
        run: >-
          uv run --frozen pytest
          tests/test_starters.py::test_scaffold_exports_self_contained_python_starter
          tests/test_starters.py::test_scaffold_exports_self_contained_java_starter
          tests/test_config_kits.py::test_apply_kit_delivers_a_working_python_project
          tests/test_config_kits.py::test_apply_kit_delivers_a_working_java_project -q
